name: Deploy Memoried

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: memoried-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Check out the approved revision
        uses: actions/checkout@v4

      - name: Package tracked source files
        shell: bash
        run: |
          git archive \
            --format=tar.gz \
            --output="${RUNNER_TEMP}/memoried-${GITHUB_SHA}.tar.gz" \
            "${GITHUB_SHA}"

      - name: Configure the restricted deploy key
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.MEMORIED_DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_SSH_KEY}" > "${HOME}/.ssh/memoried-deploy"
          chmod 600 "${HOME}/.ssh/memoried-deploy"
          install -m 600 ops/memoried-known-hosts "${HOME}/.ssh/known_hosts"

      - name: Build and activate on the VPS
        shell: bash
        run: |
          ssh \
            -i "${HOME}/.ssh/memoried-deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            memoried-deploy@109.104.120.8 \
            "deploy ${GITHUB_SHA}" \
            < "${RUNNER_TEMP}/memoried-${GITHUB_SHA}.tar.gz"

      - name: Verify the public site
        shell: bash
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 5 \
            --max-time 15 \
            https://memoried.me/ \
            > /dev/null
